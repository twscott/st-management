<!DOCTYPE html>
<html>
<head>
    <title>GoodInfo 頁面分析工具</title>
</head>
<body>
    <h1>GoodInfo 頁面分析</h1>
    
    <p>打開開發者工具，在Console執行以下JavaScript來分析頁面結構：</p>
    
    <textarea rows="10" cols="100">
// 查找所有可能的下載按鈕
console.log("=== 查找所有 input 元素 ===");
document.querySelectorAll('input').forEach((input, index) => {
    console.log(`Input ${index}:`, {
        type: input.type,
        value: input.value,
        id: input.id,
        className: input.className,
        onclick: input.onclick?.toString() || input.getAttribute('onclick')
    });
});

console.log("=== 查找包含 '下載' 的元素 ===");
[...document.querySelectorAll('*')].filter(el => 
    el.textContent?.includes('下載') || 
    el.value?.includes('下載') ||
    el.getAttribute('onclick')?.includes('下載') ||
    el.getAttribute('onclick')?.includes('download')
).forEach(el => {
    console.log('下載相關元素:', {
        tagName: el.tagName,
        textContent: el.textContent?.trim(),
        value: el.value,
        onclick: el.onclick?.toString() || el.getAttribute('onclick'),
        xpath: getXPath(el)
    });
});

function getXPath(element) {
    if (element.id !== '') {
        return `//*[@id="${element.id}"]`;
    }
    if (element === document.body) {
        return '/html/body';
    }
    let ix = 0;
    let siblings = element.parentNode?.childNodes || [];
    for (let i = 0; i < siblings.length; i++) {
        let sibling = siblings[i];
        if (sibling === element) {
            return getXPath(element.parentNode) + '/' + element.tagName.toLowerCase() + '[' + (ix + 1) + ']';
        }
        if (sibling.nodeType === 1 && sibling.tagName === element.tagName) {
            ix++;
        }
    }
}
    </textarea>
    
    <h2>操作步驟：</h2>
    <ol>
        <li>打開 GoodInfo 頁面： 
            <a href="https://goodinfo.tw/tw/StockList.asp?MARKET_CAT=熱門排行&INDUSTRY_CAT=券資比#txtStockListData" target="_blank">
                券資比頁面
            </a>
        </li>
        <li>按 F12 開啟開發者工具</li>
        <li>點擊 Console 標籤</li>
        <li>複製上面的JavaScript代碼貼到Console並按Enter</li>
        <li>查看輸出結果，找到正確的下載按鈕選擇器</li>
    </ol>
</body>
</html>
